name: tests

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Edge + test deps
        run: python -m pip install -r edge_pi5/requirements-edge.txt pyyaml
      - name: Quick-start
        run: python edge_pi5/capture_preprocess.py --input examples --outbox outbox --buffer buffer
      - name: Unit tests
        run: python -m unittest discover -s tests -v
